name: Docker Image CI

on:
  push:
    branches: [ "develop" ]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Extract version from pubspec.yaml
        id: extract_version
        run: |
          RAW_VERSION=$(grep 'version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          SAFE_VERSION=${RAW_VERSION//+/-}
          echo "IMAGE_TAG=$SAFE_VERSION" >> $GITHUB_ENV

      - name: Build the Docker image
        run: |
          docker build . \
            --file Dockerfile \
            --tag ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ env.IMAGE_TAG }}

      - name: Push the Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ env.IMAGE_TAG }}